services:
  open-seo:
    # No rankloop image is published yet. `ghcr.io/every-app/open-seo:latest`
    # used to be the default here — it is UPSTREAM OpenSEO and contains none of
    # rankloop, so an unbuilt `docker compose up` silently ran a different
    # product. Build first (below) and this resolves; skip the build and you
    # get an honest "image not found".
    image: ${OPEN_SEO_IMAGE:-rankloop:local}
    # `docker compose build` / `up --build` from THIS directory. The context is
    # the repo root because the dashboard links @rankloop/engine from
    # ../../packages — see apps/dashboard/Dockerfile.selfhost.
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile.selfhost
    restart: unless-stopped
    # Forward EVERY .env value into the container. The explicit `environment:`
    # list below still wins for the values it names — without this, any .env
    # value not listed there (e.g. OPENROUTER_API_KEY) silently never reached
    # the app. Compose errors if .env is missing; the quickstart's
    # `cp .env.example .env` creates it.
    env_file:
      - .env
    # Anonymous usage heartbeat controls: docs/SELF_HOSTING_DOCKER.md#telemetry
    environment:
      # Required for local Docker self-hosting: exposes Compose env vars to cloudflare:workers bindings.
      - CLOUDFLARE_INCLUDE_PROCESS_ENV=true
      - PORT=${PORT:-3001}
      - ALLOWED_HOST=${ALLOWED_HOST:-}
      - AUTH_MODE=local_noauth
      - OPENSEO_TELEMETRY_DISABLED=${OPENSEO_TELEMETRY_DISABLED:-}
      - DO_NOT_TRACK=${DO_NOT_TRACK:-}
      - DATAFORSEO_API_KEY=${DATAFORSEO_API_KEY}
      # The writer's key. rankloop's whole write side — drafts, the onboarding
      # chat, SAM — is dark without it; only the study/plan side works.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      # Optional: Google Search Console. See
      # docs/SELF_HOSTING_GOOGLE_SEARCH_CONSOLE.md
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      # Optional: IndexNow ping on publish. Only useful once <key>.txt is served
      # from your own site root; absent, publishing skips the submission.
      - INDEXNOW_KEY=${INDEXNOW_KEY:-}
      - VITE_SHOW_DEVTOOLS=false
    ports:
      - "127.0.0.1:${PORT:-3001}:${PORT:-3001}"
    volumes:
      # The D1/KV/R2/Durable-Object state miniflare writes, relative to the
      # image's WORKDIR (/app/apps/dashboard). Point this anywhere else and
      # every project, keyword and draft is lost on `docker compose down`.
      - open_seo_data:/app/apps/dashboard/.wrangler
volumes:
  open_seo_data:
